<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173f33">
  <meta name="description" content="Benkowo — dom w Białowieży. Nowa strona i oferta pobytu już wkrótce.">
  <title>Benkowo — dom w Białowieży</title>
  <style>
    :root {
      color-scheme: light;
      --forest: #173f33;
      --forest-dark: #0d2b23;
      --cream: #f6f1e7;
      --sand: #dfcda9;
      --white: #fffdf8;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--forest-dark); }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      color: var(--white);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 18% 18%, rgba(223, 205, 169, .22), transparent 28rem),
        radial-gradient(circle at 82% 76%, rgba(89, 139, 112, .28), transparent 30rem),
        linear-gradient(145deg, var(--forest) 0%, var(--forest-dark) 100%);
    }
    body::before,
    body::after {
      content: "";
      position: fixed;
      border: 1px solid rgba(255, 253, 248, .12);
      border-radius: 50%;
      pointer-events: none;
    }
    body::before { width: 34rem; height: 34rem; left: -18rem; bottom: -20rem; }
    body::after { width: 23rem; height: 23rem; right: -13rem; top: -12rem; }
    main {
      width: min(70rem, calc(100% - 2rem));
      padding: clamp(1.5rem, 4vw, 4rem);
    }
    .eyebrow {
      display: flex;
      align-items: center;
      gap: .75rem;
      margin: 0 0 2rem;
      color: var(--sand);
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    .eyebrow::before { content: ""; width: 2.5rem; height: 1px; background: currentColor; }
    h1 {
      max-width: 12ch;
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(4rem, 12vw, 9.5rem);
      font-weight: 400;
      line-height: .83;
      letter-spacing: -.06em;
    }
    h1 span { display: block; color: var(--sand); font-size: .46em; letter-spacing: -.035em; }
    .lead {
      max-width: 35rem;
      margin: clamp(2rem, 5vw, 3.5rem) 0 0;
      color: rgba(255, 253, 248, .82);
      font-size: clamp(1.05rem, 2vw, 1.3rem);
      line-height: 1.65;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: .85rem;
      margin-top: 2.25rem;
    }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 3.25rem;
      padding: .85rem 1.3rem;
      border: 1px solid rgba(255, 253, 248, .28);
      border-radius: 999px;
      color: var(--white);
      font-weight: 700;
      text-decoration: none;
      transition: transform .2s ease, background .2s ease;
    }
    .button.primary { background: var(--cream); color: var(--forest-dark); border-color: var(--cream); }
    .button:hover { transform: translateY(-2px); background: var(--sand); color: var(--forest-dark); border-color: var(--sand); }
    footer {
      display: flex;
      flex-wrap: wrap;
      gap: .7rem 1.4rem;
      margin-top: clamp(3.5rem, 8vw, 6.5rem);
      padding-top: 1.4rem;
      border-top: 1px solid rgba(255, 253, 248, .15);
      color: rgba(255, 253, 248, .62);
      font-size: .9rem;
    }
    footer a { color: inherit; text-decoration: none; }
    footer a:hover { color: var(--white); }
    @media (max-width: 34rem) {
      main { padding-block: 2rem; }
      h1 { font-size: clamp(3.7rem, 20vw, 6rem); }
      .actions { flex-direction: column; }
      .button { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Białowieża · Puszcza Białowieska</p>
    <h1>Benkowo <span>dom blisko natury</span></h1>
    <p class="lead">
      Przygotowujemy nową stronę i pełną ofertę pobytu. Jeśli chcesz zapytać
      o dostępność domu, skontaktuj się z nami już teraz.
    </p>
    <div class="actions">
      <a class="button primary" href="tel:+48602761082">Zadzwoń: +48 602 761 082</a>
      <a class="button" href="https://maps.google.com/?q=Stoczek+178%2C+17-230+Białowieża">Zobacz lokalizację</a>
    </div>
    <footer>
      <span>Stoczek 178, 17-230 Białowieża</span>
      <a href="tel:+48602761082">+48 602 761 082</a>
      <span>© 2026 Benkowo</span>
    </footer>
  </main>
</body>
</html>
